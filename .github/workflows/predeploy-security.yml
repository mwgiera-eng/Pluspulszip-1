name: Pre-deploy security checks

on:
  push:
    branches: [ dev, main ]
  pull_request:
    branches: [ dev, main ]

jobs:
  predeploy-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run predeploy script
        run: |
          chmod +x ./.github/scripts/predeploy-check.sh || true
          ./.github/scripts/predeploy-check.sh
