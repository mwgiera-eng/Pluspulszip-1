services:
  - type: web
    name: pluspulszip
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node dist/migrate.cjs && npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: pluspulszip-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: APP_URL
        value: https://pluspulszip.onrender.com
      - key: EMAIL_DELIVERY_URL
        sync: false
      - key: EMAIL_API_KEY
        sync: false

databases:
  - name: pluspulszip-db
    plan: free
