services:
  - type: web
    name: pluspuls-app
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: pluspuls-db
          property: connectionString
      - key: APP_BASE_URL
        sync: false
      - key: P24_SANDBOX
        value: "true"
      - key: P24_MERCHANT_ID
        sync: false
      - key: P24_POS_ID
        sync: false
      - key: P24_CRC_KEY
        sync: false
      - key: P24_API_KEY
        sync: false
      - key: PAYPAL_SANDBOX
        value: "true"
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false

databases:
  - name: pluspuls-db
    plan: free
