services:
  - type: web
    name: pluspulszip
    runtime: node
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pluspulszip-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: APP_URL
        value: https://pluspulszip.onrender.com
      - key: EMAIL_DELIVERY_URL
        sync: false
      - key: EMAIL_API_KEY
        sync: false

databases:
  - name: pluspulszip-db
